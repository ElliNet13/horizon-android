[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The game as an Android app: a NativeActivity library that starts horizon-game with touch controls (android/README.md)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `android_main` is this crate's; `horizon-android-debug` turns it off and has its own.
default = ["entry-point"]
entry-point = []

# The Java runtime fetch (`provision`) builds everywhere, so its tests run on a desktop.
[dependencies]
sha2 = "0.10.9"
tar = { version = "0.4", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
xz4rust = "0.2.3"
libc = "0.2"
sha1 = "0.10"
log = "0.4"
horizon-prepare = { path = "../horizon-prepare" }
serde_json = "1"
# The launcher page (`launcher_page`) builds everywhere, so its tests run on a desktop.
horizon-hooks = { path = "../horizon-hooks" }
# Horizon's extras: cosmetics, the Horizon Settings and Mods pages, Play with Friends...
horizon-client = { path = "../horizon-client", default-features = false, features = ["horizon-extras"] }
# The parts `horizon-official` registers on a desktop, without it: it brings the audio and
# controller crates, and Discord and perf sharing mean nothing on a phone (`entry`).
horizon-heartbeat = { path = "../horizon-heartbeat" }
horizon-friends = { path = "../horizon-friends", features = ["game"] }
horizon-official-servers = { path = "../horizon-official-servers" }

[build-dependencies]
tar = { version = "0.4", default-features = false }

# The rest is Android-only: on other targets the entry is empty, so the workspace builds as before.
[target.'cfg(target_os = "android")'.dependencies]
horizon-game = { path = "../horizon-game", default-features = false, features = ["horizon-extras"] }
winit = { version = "0.30.13", features = ["android-native-activity"] }
android_logger = "0.14"
jni = "0.21"

[lints]
workspace = true

# Build with `cargo apk build --release -p horizon-android` (cargo-apk, NativeActivity).
[package.metadata.android]
package = "dev.horizon.android"
apk_name = "Horizon"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Horizon"

[package.metadata.android.application.activity]
orientation = "sensorLandscape"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|uiMode|smallestScreenSize|density"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

# Lets the game keep its files in Documents/Horizon, where the Files app shows them (`storage`).
# The player grants it in Settings; without it the game keeps using the app's private folder.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"
