[package]
name = "horizon-android-debug"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Android game as its own app, \"Horizon (Debug)\" (dev.horizon.android.debug), so a debug build installs beside the release one (android/README.md)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-android = { path = "../horizon-android", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }

[lints]
workspace = true

# Build with `cargo apk build -p horizon-android-debug` (the same game as horizon-android; only
# the app's name and package differ). cargo-apk takes these from the crate it builds.
[package.metadata.android]
package = "dev.horizon.android.debug"
apk_name = "Horizon (Debug)"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Horizon (Debug)"

[package.metadata.android.application.activity]
orientation = "sensorLandscape"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|uiMode|smallestScreenSize|density"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"
